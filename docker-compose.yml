name: fortress-monad

services:
  # ── 1. Backend Service (Fastify + OpenAI Planner + EVM Kernel) ──
  backend:
    build:
      context: ./Monad_Backend
      dockerfile: Dockerfile
    container_name: fortress-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: ./.env
        required: false
      - path: ./Monad_Backend/.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_FALLBACK_MODELS=${OPENAI_FALLBACK_MODELS:-}
      - OPENAI_FINAL_FALLBACK_API_KEY=${OPENAI_FINAL_FALLBACK_API_KEY:-}
      - OPENAI_FINAL_FALLBACK_MODEL=${OPENAI_FINAL_FALLBACK_MODEL:-}
      - TENDERLY_ACCESS_KEY=${TENDERLY_ACCESS_KEY}
      - TENDERLY_ACCOUNT_SLUG=${TENDERLY_ACCOUNT_SLUG}
      - TENDERLY_PROJECT_SLUG=${TENDERLY_PROJECT_SLUG}
      - RPC_BASE=${RPC_BASE:-https://mainnet.base.org}
      - RPC_ETH=${RPC_ETH:-https://ethereum-rpc.publicnode.com}
      - RPC_ARB=${RPC_ARB:-https://arb1.arbitrum.io/rpc}
      - RPC_MONAD=${RPC_MONAD:-https://rpc.monad.xyz}
      - RPC_MONAD_TESTNET=${RPC_MONAD_TESTNET:-https://testnet-rpc.monad.xyz}
      - APY_DATABASE_URL=${APY_DATABASE_URL}
      - APY_REDIS_URL=${APY_REDIS_URL:-redis://redis:6379}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,https://fortress.bhattdev.in,https://api.fortress.bhattdev.in}
    depends_on:
      - redis
    networks:
      - fortress-net

  # ── 2. Redis Cache Service ──
  redis:
    image: redis:7-alpine
    container_name: fortress-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fortress-net

  # ── 2. Frontend Web Application (Next.js 16 + Wagmi + AppKit) ──
  frontend:
    build:
      context: ./Monad_frontend/fortress-fe-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-07ca18e4747adb59df06ff3f799b61ba}
        NEXT_PUBLIC_MONAD_RPC_URL: ${NEXT_PUBLIC_MONAD_RPC_URL:-https://rpc.monad.xyz}
        NEXT_PUBLIC_MONAD_TESTNET_RPC_URL: ${NEXT_PUBLIC_MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
        NEXT_PUBLIC_BASE_RPC_URL: ${NEXT_PUBLIC_BASE_RPC_URL:-https://mainnet.base.org}
        NEXT_PUBLIC_MONAD_USDC_ADDRESS: ${NEXT_PUBLIC_MONAD_USDC_ADDRESS:-}
        NEXT_PUBLIC_MONAD_WMON_ADDRESS: ${NEXT_PUBLIC_MONAD_WMON_ADDRESS:-}
        NEXT_PUBLIC_MONAD_WETH_ADDRESS: ${NEXT_PUBLIC_MONAD_WETH_ADDRESS:-}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api.fortress.bhattdev.in}
        BACKEND_API_ORIGIN: ${BACKEND_API_ORIGIN:-http://backend:3000}
    container_name: fortress-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./.env
        required: false
      - path: ./Monad_frontend/fortress-fe-main/apps/web/.env.local
        required: false
      - path: ./Monad_frontend/fortress-fe-main/.env
        required: false
    environment:
      - PORT=3001
      - NODE_ENV=production
      - BACKEND_API_ORIGIN=http://backend:3000
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-https://api.fortress.bhattdev.in}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-07ca18e4747adb59df06ff3f799b61ba}
      - NEXT_PUBLIC_MONAD_RPC_URL=${NEXT_PUBLIC_MONAD_RPC_URL:-https://rpc.monad.xyz}
      - NEXT_PUBLIC_MONAD_TESTNET_RPC_URL=${NEXT_PUBLIC_MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
      - NEXT_PUBLIC_BASE_RPC_URL=${NEXT_PUBLIC_BASE_RPC_URL:-https://mainnet.base.org}
    depends_on:
      - backend
    networks:
      - fortress-net

networks:
  fortress-net:
    driver: bridge

volumes:
  redis-data:
