name: fortress-monad

# Configuration precedence, lowest to highest:
#   1. deploy/local-defaults.env   — makes the stack boot with zero setup
#   2. ./.env                      — repo-wide overrides
#   3. ./Monad_Backend/.env        — your real credentials; always wins
#
# `environment:` is reserved for values that MUST differ inside the container
# network (a service hostname, the listen port). Docker Compose gives
# `environment:` precedence over `env_file:`, so anything secret-shaped listed
# there would silently override your .env — which is exactly how the backend
# ended up authenticating against the local Postgres as user "postgres" instead
# of the configured database.

services:
  # ── 1. Database migrations (one-shot, runs before the backend) ────────────
  # 009_monad_markets.sql deletes the Base-era chain-8453 rows seeded by
  # 002/003. Without this the APY poller keeps finding markets on a chain the
  # Aave adapter has no pool for and skips them on every tick.
  migrate:
    build:
      context: ./Monad_Backend
      dockerfile: Dockerfile
    container_name: fortress-migrate
    command: ["npm", "run", "migrate"]
    env_file:
      - path: ./deploy/local-defaults.env
        required: false
      - path: ./.env
        required: false
      - path: ./Monad_Backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - fortress-net

  # ── 2. Backend Service (Fastify + OpenAI Planner + EVM Kernel) ────────────
  backend:
    build:
      context: ./Monad_Backend
      dockerfile: Dockerfile
    container_name: fortress-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: ./deploy/local-defaults.env
        required: false
      - path: ./.env
        required: false
      - path: ./Monad_Backend/.env
        required: false
    environment:
      # Container-specific only. Everything else comes from the files above.
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fortress-net

  # ── 3. Redis Cache Service ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fortress-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fortress-net

  # ── 4. PostgreSQL Database ────────────────────────────────────────────────
  # Credentials match deploy/local-defaults.env. POSTGRES_HOST_AUTH_METHOD=trust
  # was removed: it only applies when the data volume is first created, so once
  # a volume exists with a password set it does nothing but make auth failures
  # confusing. If you are upgrading from the old stack, the old volume still has
  # the old role — `docker compose down -v` to recreate it.
  postgres:
    image: postgres:16-alpine
    container_name: fortress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortress
      POSTGRES_PASSWORD: fortress
      POSTGRES_DB: fortress
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortress -d fortress"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fortress-net

  # ── 5. Frontend Web Application (Next.js 16 + Wagmi + AppKit) ─────────────
  frontend:
    build:
      context: ./Monad_frontend/fortress-fe-main
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined at build time, so these must be build args.
      # They interpolate from the shell and ./.env — env_file does not apply to
      # the build stage.
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_MONAD_RPC_URL: ${NEXT_PUBLIC_MONAD_RPC_URL:-https://rpc.monad.xyz}
        NEXT_PUBLIC_MONAD_TESTNET_RPC_URL: ${NEXT_PUBLIC_MONAD_TESTNET_RPC_URL:-https://testnet-rpc.monad.xyz}
        # Inlined into the JS bundle at build time, and resolveBase() in
        # packages/core/api/client.ts checks it BEFORE its own
        # "https://api.<current-hostname>" fallback. So a wrong value here is
        # not merely a default — it actively defeats the logic that would have
        # worked. Baking in localhost is what made the deployed frontend call
        # http://localhost:3000. Set this to the API origin for the environment
        # you are building for, or leave it EMPTY to let the hostname fallback
        # derive api.<host> on its own.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api.fortress.bhattdev.in}
        BACKEND_API_ORIGIN: ${BACKEND_API_ORIGIN:-http://backend:3000}
    container_name: fortress-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./.env
        required: false
      - path: ./Monad_frontend/fortress-fe-main/apps/web/.env.local
        required: false
      - path: ./Monad_frontend/fortress-fe-main/.env
        required: false
    environment:
      # Container-specific only: the port it listens on, and how it reaches the
      # backend across the compose network.
      - PORT=3001
      - NODE_ENV=production
      - BACKEND_API_ORIGIN=http://backend:3000
    depends_on:
      - backend
    networks:
      - fortress-net

networks:
  fortress-net:
    driver: bridge

volumes:
  redis-data:
  pg-data:
